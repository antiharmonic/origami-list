name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the app and browser-test images from compose.yaml, with layers cached between runs.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v5
        with:
          files: compose.yaml
          targets: app,e2e
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # compose.yaml bind-mounts these; the tests themselves use temp folders.
      - run: mkdir -p ~/Books/Origami data

      - name: Unit tests
        run: docker compose run --rm --no-deps app pytest -q

      - name: Browser tests
        run: docker compose --profile test run --rm e2e
