<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Origami List{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sortable.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <a class="brand" href="/">Origami List</a>
      {% include "_todo_count.html" %}
    </div>
    <nav>
      <a href="/models/new" class="button primary">+ Add model</a>
      <a href="/library">Library</a>
      <a href="/books-admin">Import / export</a>
      <button type="button" id="notes-toggle" title="Notes (Alt+N)" aria-controls="notes-panel">Notes</button>
    </nav>
  </header>
  {% set warning = books_warning() %}
  {% if warning %}<div class="banner-warning" role="alert">{{ warning }}</div>{% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include "_notes.html" %}
  <script>
    // Drag-to-reorder on the main list (only when sorted by "my order").
    htmx.onLoad(function (root) {
      var list = root.id === "list" ? root : root.querySelector && root.querySelector("#list");
      if (!list || !list.classList.contains("sortable") || list._sortable) return;
      list._sortable = Sortable.create(list, {
        handle: ".handle",
        animation: 150,
        onEnd: function (e) {
          if (e.oldIndex === e.newIndex) return;
          var prev = e.item.previousElementSibling, next = e.item.nextElementSibling;
          fetch("/models/" + e.item.dataset.id + "/move", {
            method: "POST",
            body: new URLSearchParams({
              prev: prev && prev.dataset.id || "",
              next: next && next.dataset.id || "",
            }),
          });
        },
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
